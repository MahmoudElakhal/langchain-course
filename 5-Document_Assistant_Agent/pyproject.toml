[project]
name = "5-document-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4",
    "black",
    "tiktoken",
    "openai",
    "unstructured",
    "nltk",
    "fastapi",
    "jinja2",
    "uvicorn",
    "streamlit",
    "streamlit-chat",
    "tqdm",
    "isort",
    "langchainhub",
    "firecrawl-py",
    "langchain-community",
    "langsmith",
    "pillow",
    "certifi",
    "langchain-chroma",
    "chromadb",
    "python-dotenv",
    "langchain-tavily",
    "langchain-pinecone",
]

[dependency-groups]
dev = [
    "ipykernel",
]

# Equivalent of Pipfile's allow_prereleases = true (uv only)
[tool.uv]
prerelease = "allow"
